apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-echo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        image: k8s.gcr.io/echoserver:1.4
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app2-echo-svc
spec:
  type: NodePort
  selector:
    app: echo
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30002